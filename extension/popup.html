<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>WB Analytics</title>
    <!--
      Стили popup'а лежат инлайном, чтобы не тащить отдельный CSS-файл:
      popup маленький и изолирован от страниц WB.
    -->
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        width: 360px;
        margin: 0;
        font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        color: #0f172a;
        background: #f8fafc;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        background: #7c3aed;
        color: #fff;
      }
      header h1 {
        font-size: 15px;
        margin: 0;
      }
      .refresh {
        border: none;
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
        padding: 6px 10px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 12px;
      }
      .refresh:hover {
        background: rgba(255, 255, 255, 0.3);
      }
      .refresh:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .status {
        padding: 8px 16px;
        font-size: 12px;
        color: #64748b;
      }
      .status--error {
        color: #dc2626;
      }
      h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #64748b;
        margin: 12px 16px 6px;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0 8px 8px;
      }
      li {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 8px 10px;
        margin: 6px 8px;
        font-size: 13px;
      }
      .item-title {
        font-weight: 600;
        display: block;
        margin-bottom: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .item-meta {
        display: flex;
        justify-content: space-between;
        color: #64748b;
        font-size: 12px;
      }
      .item-meta strong {
        color: #6d28d9;
      }
      .empty {
        padding: 8px 24px 16px;
        color: #94a3b8;
        font-size: 13px;
      }
      .actions {
        padding: 0 16px;
      }
      .refresh-tracked {
        width: 100%;
        border: none;
        background: #7c3aed;
        color: #fff;
        padding: 8px 10px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 12px;
      }
      .refresh-tracked:hover {
        background: #6d28d9;
      }
      .refresh-tracked:disabled {
        opacity: 0.6;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>WB Analytics</h1>
      <button id="refresh" class="refresh" title="Обновить сейчас">⟳ Обновить</button>
    </header>

    <div id="status" class="status">Загрузка…</div>

    <div class="actions">
      <button id="refresh-tracked" class="refresh-tracked" title="Открыть отслеживаемые товары в фоне и обновить их данные">
        ⚡ Обновить отслеживаемые товары
      </button>
    </div>

    <h2>Топ-5 по скорости продаж</h2>
    <ul id="top-list"></ul>
    <div id="top-empty" class="empty" hidden>Пока нет данных. Откройте карточку товара на WB.</div>

    <h2>Последние спарсенные</h2>
    <ul id="recent-list"></ul>
    <div id="recent-empty" class="empty" hidden>Пока ничего не спарсено.</div>

    <script src="popup.js"></script>
  </body>
</html>
